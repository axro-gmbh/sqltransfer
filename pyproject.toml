[project]
name = "sqltransfer"
version = "1.1.0"
description = "Flet desktop app for transferring SQL data with optional SSH tunneling"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "flet[desktop]>=1.0.0,<2.0",
  "apitap>=0.56.0",  # built locally on macOS, see README
  "sshtunnel>=0.4.0",
  "paramiko<4",
  "keyring>=25.6.0",
  "pymysql>=1.1.1",
  "psycopg[binary]>=3.2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.flet]
product = "SQL Transfer"
company = "Axro"
org = "de.axro"
bundle_id = "de.axro.sqltransfer"
# CFBundleVersion. Sparkle compares this, not the version string: raise it with
# every release, never reuse one.
build_number = 3

# Sparkle auto-updates. The plugin starts Sparkle's standard updater on launch,
# which reads the feed and the public key below; see MACOS_BUILD.md, "Releases".
[tool.flet.flutter.pubspec.dependencies]
auto_updater = "1.0.0"

[tool.flet.macos.info]
SUFeedURL = "https://github.com/axro-gmbh/sqltransfer/releases/latest/download/appcast.xml"
SUPublicEDKey = "plOoFrteTxIp3kCx2Tr3pG4qS/cXdFUXppcr4XuVZxc="
SUEnableAutomaticChecks = true
# About window. Set here rather than in tool.flet.copyright, whose template
# appends "All rights reserved.", which does not fit an Apache-2.0 app.
NSHumanReadableCopyright = "Copyright © 2026 Axro GmbH"

# apitap has no macOS wheel on PyPI (Linux x86_64 only), so the bundle is built
# against the locally built wheel. Rebuild instructions: see MACOS_BUILD.md.
[tool.flet.dev_packages]
apitap = ".vendor/apitap-0.56.0-cp39-abi3-macosx_11_0_arm64.whl"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


