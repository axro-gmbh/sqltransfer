[project]
name = "sqltransfer"
version = "0.1.0"
description = "Flet desktop app for transferring SQL data with optional SSH tunneling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet[desktop]>=1.0.0,<2.0",
  "apitap>=0.5.0",
  "sshtunnel>=0.4.0",
  "paramiko<4",
  "keyring>=25.6.0",
  "pymysql>=1.1.1",
  "psycopg[binary]>=3.2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


